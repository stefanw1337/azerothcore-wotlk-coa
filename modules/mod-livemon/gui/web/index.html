<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveMon</title>
<link rel="icon" href="troll-icon.png">
<style>
@font-face { font-family: "Friz"; src: url("wow/font?path=Fonts%5CFRIZQT__.TTF"); }
@font-face { font-family: "WowNumbers"; src: url("wow/font?path=Fonts%5CARIALN.TTF"); }
:root {
  --gold: #ffd100; --gold-dim: #c8a24a; --metal-hi: #f3d68a; --metal: #a07a2c; --metal-lo: #4a3410;
  --text: #ffffff; --muted: #a9a9a9; --green: #1eff00; --red: #ff2020; --blue: #0070dd;
  --frame-bg: rgba(8, 8, 12, .86); --row: rgba(255, 255, 255, .035); --hover: rgba(255, 209, 0, .12);
  --sel: rgba(0, 112, 221, .28); --bar: url("wow/texture?path=Interface%5CTargetingFrame%5CUI-StatusBar");
}
* { box-sizing: border-box; }
html { background: #050506; }
body { margin: 0; color: var(--text); font: 13px/1.35 "WowNumbers", "Arial Narrow", Arial, sans-serif; min-height: 100vh;
  background: radial-gradient(ellipse at 50% -10%, rgba(80, 60, 30, .35), transparent 60%),
    url("wow/texture?path=Interface%5CDialogFrame%5CUI-DialogBox-Background-Dark") repeat, #0c0b0a; }
h1, h2, th, .tile span, label, .gold { font-family: "Friz", "Cinzel", Georgia, serif; }
.gold { color: var(--gold); }

.unitframe { position: relative; width: 330px; height: 112px; flex: none; }
.portrait { position: absolute; left: 6px; top: 6px; width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #3b2a1a, #120c08 70%); overflow: hidden;
  box-shadow: 0 0 0 3px #1a1006, 0 0 0 7px var(--metal), 0 0 0 9px var(--metal-lo), 0 0 0 10px #000,
    inset 0 0 12px #000, 0 4px 14px rgba(0, 0, 0, .8); z-index: 2; }
.portrait::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 210deg, rgba(255, 240, 190, .55), transparent 25%, rgba(255, 240, 190, .25) 50%,
    transparent 75%, rgba(255, 240, 190, .55)); mix-blend-mode: overlay; pointer-events: none; }
.portrait img { position: absolute; width: 122px; left: -16px; top: -4px; }
.ring { position: absolute; left: -1px; top: -1px; width: 114px; height: 114px; border-radius: 50%; z-index: 3;
  background: conic-gradient(var(--metal-hi), var(--metal), var(--metal-lo), var(--metal), var(--metal-hi),
    var(--metal-lo), var(--metal), var(--metal-hi));
  -webkit-mask: radial-gradient(circle, transparent 50px, #000 51px, #000 56px, transparent 57px);
  mask: radial-gradient(circle, transparent 50px, #000 51px, #000 56px, transparent 57px); }
.level { position: absolute; left: 2px; top: 76px; width: 32px; height: 32px; border-radius: 50%; z-index: 4;
  display: grid; place-items: center; font: 600 14px "Friz", Georgia, serif; color: var(--gold);
  background: radial-gradient(circle at 40% 35%, #3a2a12, #0b0703); box-shadow: 0 0 0 2px var(--metal), 0 0 0 3px #000; }
.plate { position: absolute; left: 92px; top: 22px; width: 232px; padding: 5px 10px 7px 26px; z-index: 1;
  background: linear-gradient(#1b1610, #0a0806); border: 2px solid var(--metal); border-left: 0;
  border-radius: 0 8px 8px 0; box-shadow: inset 0 0 0 1px #000, 0 3px 10px rgba(0, 0, 0, .7); }
.plate h1 { margin: 0 0 3px; font-size: 16px; color: var(--gold); text-shadow: 1px 1px 0 #000; font-weight: 400; }
.unitbar { position: relative; height: 13px; margin-top: 2px; background: #000; border: 1px solid #000;
  box-shadow: 0 0 0 1px #3a2c12; }
.unitbar i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--bar), currentColor;
  background-size: 100% 100%; background-blend-mode: multiply; transition: width .4s; }
.unitbar span { position: relative; display: block; color: #fff; text-align: center; font-size: 11px; line-height: 13px;
  text-shadow: 1px 1px 0 #000; }

header { display: flex; align-items: center; gap: 22px; padding: 10px 20px 4px; }
.spacer { flex: 1; }
label { color: var(--gold); font-size: 12px; }
select { font: 12px "Friz", Georgia, serif; color: var(--gold); padding: 4px 26px 4px 10px; border-radius: 4px;
  border: 1px solid #000; box-shadow: 0 0 0 1px var(--metal), inset 0 1px 0 rgba(255, 255, 255, .15);
  background: linear-gradient(#8e1414, #4a0505 60%, #2b0202); appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%),
    linear-gradient(#8e1414, #4a0505 60%, #2b0202);
  background-position: right 12px top 50%, right 7px top 50%, 0 0; background-size: 5px 5px, 5px 5px, 100% 100%;
  background-repeat: no-repeat; }
select option { background: #160c08; color: var(--gold); }

main { padding: 14px 20px 24px; display: grid; gap: 26px 18px; grid-template-columns: minmax(0, 1fr) 380px; }
section { position: relative; background: var(--frame-bg); padding: 26px 14px 12px; min-width: 0; border-radius: 6px;
  border: 3px solid transparent;
  background-image: linear-gradient(var(--frame-bg), var(--frame-bg)),
    linear-gradient(160deg, var(--metal-hi), var(--metal) 30%, var(--metal-lo) 55%, var(--metal) 80%, var(--metal-hi));
  background-origin: border-box; background-clip: padding-box, border-box;
  box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #000, 0 6px 18px rgba(0, 0, 0, .75); }
section::before, section::after { content: ""; position: absolute; top: -7px; width: 12px; height: 12px;
  transform: rotate(45deg); background: radial-gradient(circle at 35% 35%, #ffe9a8, var(--metal) 55%, var(--metal-lo));
  box-shadow: 0 0 0 1px #000; }
section::before { left: -7px; } section::after { right: -7px; }
section h2 { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap;
  padding: 5px 26px 6px; font-size: 13px; font-weight: 400; color: var(--gold); text-shadow: 1px 1px 0 #000;
  background: linear-gradient(#3a2a12, #160f06); border: 2px solid var(--metal); border-radius: 3px;
  box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 230, 160, .25), 0 3px 8px rgba(0, 0, 0, .8); }
section h2 small { color: var(--muted); font-size: 11px; margin-left: 6px; }
.wide { grid-column: 1 / -1; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: center; padding: 7px 6px 8px; background: linear-gradient(rgba(255, 255, 255, .05), transparent);
  border: 1px solid #2c2416; border-radius: 4px; }
.tile b { display: block; font: 600 22px "WowNumbers", "Arial Narrow", sans-serif; color: #fff;
  text-shadow: 1px 1px 0 #000; font-variant-numeric: tabular-nums; }
.tile span { color: var(--gold); font-size: 11px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 7px; text-align: right; white-space: nowrap; }
th { color: var(--gold); font-weight: 400; font-size: 11px; cursor: pointer; user-select: none;
  border-bottom: 1px solid #5a4520; text-shadow: 1px 1px 0 #000; }
th:hover { color: #fff; }
th.sorted::after { content: " \25BE"; }
th.sorted.asc::after { content: " \25B4"; }
tbody tr:nth-child(even) td, tr:nth-child(even) td { background: var(--row); }
td { text-shadow: 1px 1px 0 #000; }
td.l, th.l { text-align: left; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--hover); }
tr.selected td { background: var(--sel); }
tr.offline td { color: #777; }
.hp { width: 76px; height: 10px; display: inline-block; background: #000; border: 1px solid #000;
  box-shadow: 0 0 0 1px #3a2c12; position: relative; vertical-align: middle; }
.hp i { position: absolute; inset: 0 auto 0 0; color: var(--green); background: var(--bar), currentColor;
  background-size: 100% 100%; background-blend-mode: multiply; }
.fight { color: var(--red); }
.bars div { display: grid; grid-template-columns: 22px var(--label, 120px) 1fr 66px; gap: 7px; align-items: center;
  margin: 3px 0; }
.bars.noicons div { grid-template-columns: var(--label, 120px) 1fr 66px; }
.bars img, .bars .noicon { width: 22px; height: 22px; border: 1px solid #000; box-shadow: 0 0 0 1px #5a4520; }
.bars .noicon { background: #222; }
.bars em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff;
  text-shadow: 1px 1px 0 #000; }
.bars s { position: relative; display: block; height: 16px; text-decoration: none; min-width: 2px; color: #c41f1f;
  background: var(--bar), currentColor; background-size: 100% 100%; background-blend-mode: multiply;
  border: 1px solid #000; }
.bars s.heal { color: #2fbf2f; }
.bars s.dps { color: #c79c3a; }
.bars b { text-align: right; font-weight: 400; color: #fff; text-shadow: 1px 1px 0 #000; }
.bars p { margin: 6px 0 4px; color: var(--gold); font-family: "Friz", Georgia, serif; font-size: 12px; }
.muted { color: var(--muted); }
.up { color: var(--green); }
.down { color: var(--red); }
canvas { width: 100%; height: 90px; display: block; background: rgba(0, 0, 0, .45); border: 1px solid #2c2416; }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }
@media (max-width: 1050px) { main { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(3, 1fr); }
  header { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <div class="unitframe">
    <div class="portrait"><img src="troll.png" alt="" onerror="this.remove()"></div>
    <div class="ring"></div>
    <div class="level" id="online" title="Characters online">0</div>
    <div class="plate">
      <h1>LiveMon</h1>
      <div class="unitbar" style="color:#1eff00"><i id="hpBar"></i><span id="status">Connecting…</span></div>
      <div class="unitbar" style="color:#0070dd"><i id="manaBar"></i><span id="uptime">&nbsp;</span></div>
    </div>
  </div>
  <div class="spacer"></div>
  <label>History <select id="window">
    <option value="15">15 minutes</option><option value="60" selected>1 hour</option>
    <option value="1440">24 hours</option><option value="10080">7 days</option><option value="525600">All</option>
  </select></label>
  <label>Group by <select id="group">
    <option value="combo">Race · spec · class · subclass</option><option value="pair">Class + subclass</option>
    <option value="class">Main class</option><option value="race">Race</option>
  </select></label>
</header>
<main>
  <section class="wide"><h2>Realm</h2><div class="tiles" id="tiles"></div></section>
  <section>
    <h2>Characters<small>this server session</small></h2>
    <div class="scroll"><table id="live"></table></div>
  </section>
  <section>
    <h2 id="detailTitle">Pick a character</h2>
    <canvas id="spark" width="660" height="180"></canvas>
    <p class="muted" id="sparkLabel" style="margin:6px 0 4px">Damage per second, last 2 minutes</p>
    <div class="bars" id="spells"></div>
    <div class="bars" id="heals" style="margin-top:10px"></div>
  </section>
  <section class="wide">
    <h2>Combos<small id="historyNote"></small></h2>
    <div class="scroll"><table id="combos"></table></div>
  </section>
  <section class="wide">
    <h2>Damage per second in combat</h2>
    <div class="bars noicons" id="comboBars" style="--label: 320px"></div>
  </section>
</main>
<script>
const CLASS_COLORS = { 1: "#c79c6e", 2: "#f58cba", 3: "#abd473", 4: "#fff569", 5: "#ffffff", 6: "#c41f3b",
  7: "#0070de", 8: "#69ccf0", 9: "#9482c9", 11: "#ff7d0a" };
const SPECS = { 1: ["Arms", "Fury", "Protection"], 2: ["Holy", "Protection", "Retribution"],
  3: ["Beast Mastery", "Marksmanship", "Survival"], 4: ["Assassination", "Combat", "Subtlety"],
  5: ["Discipline", "Holy", "Shadow"], 6: ["Blood", "Frost", "Unholy"], 7: ["Elemental", "Enhancement", "Restoration"],
  8: ["Arcane", "Fire", "Frost"], 9: ["Affliction", "Demonology", "Destruction"], 11: ["Balance", "Feral", "Restoration"] };
const specOf = (classId, tree) => (SPECS[classId] || [])[tree] || "Tree " + (Number(tree) + 1);
const state = { live: null, history: null, previous: {}, rates: {}, samples: {}, selected: null,
  liveSort: { key: "dpsNow", asc: false }, comboSort: { key: "dps", asc: false } };
const $ = id => document.getElementById(id);
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" :
  n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : Math.round(n).toLocaleString();
const secs = ms => (ms / 1000).toFixed(ms < 60000 ? 1 : 0) + "s";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const classCell = (name, id, sub) => `<span style="color:${CLASS_COLORS[id] || "#c9ced6"}">${esc(name)}</span>` +
  (sub ? ` <span class="muted">(${esc(sub)})</span>` : "");
const perSec = (value, ms) => ms > 0 ? value / (ms / 1000) : 0;

function sortRows(rows, sort) {
  return rows.sort((a, b) => {
    const x = a[sort.key], y = b[sort.key];
    const order = typeof x === "string" ? String(x).localeCompare(y) : (x || 0) - (y || 0);
    return sort.asc ? order : -order;
  });
}

function renderTable(table, columns, rows, sort, onPick, rowClass) {
  const head = "<tr>" + columns.map(c => `<th data-key="${c.key}" class="${c.left ? "l " : ""}${sort.key === c.key ?
    "sorted" + (sort.asc ? " asc" : "") : ""}">${c.label}</th>`).join("") + "</tr>";
  const body = rows.map(r => `<tr class="${onPick ? "pick " : ""}${rowClass ? rowClass(r) : ""}" data-id="${r.id ?? ""}">` +
    columns.map(c => `<td class="${c.left ? "l" : ""}">${c.show ? c.show(r) : esc(r[c.key] ?? "")}</td>`).join("") +
    "</tr>").join("");
  table.innerHTML = head + (body || `<tr><td class="empty" colspan="${columns.length}">Nothing yet</td></tr>`);
  table.querySelectorAll("th").forEach(th => th.onclick = () => {
    sort.asc = sort.key === th.dataset.key ? !sort.asc : false;
    sort.key = th.dataset.key;
    render();
  });
  if (onPick) table.querySelectorAll("tr.pick").forEach(tr => tr.onclick = () => onPick(tr.dataset.id));
}

const liveColumns = [
  { key: "name", label: "Name", left: true, show: r => (r.inCombat ? '<span class="fight">⚔</span> ' : "") +
  `<span class="gold">${esc(r.name)}</span>` },
  { key: "race", label: "Race", left: true },
  { key: "class", label: "Class", left: true, show: r => classCell(r.class, r.classId, r.subclass) },
  { key: "spec", label: "Spec", left: true },
  { key: "level", label: "Lvl" },
  { key: "hpPct", label: "Health", show: r => `<span class="hp"><i style="width:${r.hpPct}%"></i></span>` },
  { key: "dpsNow", label: "DPS now", show: r => fmt(r.dpsNow) },
  { key: "dps", label: "DPS", show: r => fmt(r.dps) },
  { key: "hps", label: "HPS", show: r => fmt(r.hps) },
  { key: "dtps", label: "Taken/s", show: r => fmt(r.dtps) },
  { key: "damage", label: "Damage", show: r => fmt(r.damage) },
  { key: "healing", label: "Healing", show: r => fmt(r.healing) },
  { key: "controlGivenMs", label: "CC given", show: r => secs(r.controlGivenMs) },
  { key: "controlTakenMs", label: "CC taken", show: r => secs(r.controlTakenMs) },
  { key: "kills", label: "Kills" },
  { key: "deaths", label: "Deaths" },
  { key: "combatMs", label: "In combat", show: r => secs(r.combatMs) },
  { key: "movedYards", label: "Moved yd", show: r => fmt(r.movedYards) },
];

function liveRows() {
  if (!state.live) return [];
  return state.live.characters.map(c => {
    const s = c.session;
    return { id: String(c.guid), name: c.name, race: c.race, class: c.class, classId: c.classId,
      subclass: c.subclass, spec: specOf(c.classId, c.tree), level: c.level, online: c.online, inCombat: c.inCombat,
      hpPct: c.maxHealth ? Math.round(100 * c.health / c.maxHealth) : 0, dpsNow: state.rates[c.guid] || 0,
      dps: perSec(s.damage, s.combatMs), hps: perSec(s.healing, s.combatMs), dtps: perSec(s.damageTaken, s.combatMs),
      ...s, raw: c };
  });
}

function renderTiles(rows) {
  const online = rows.filter(r => r.online);
  const sum = key => rows.reduce((t, r) => t + (r[key] || 0), 0);
  const tiles = [
    ["Online", online.length], ["In combat", online.filter(r => r.inCombat).length],
    ["Damage now /s", fmt(online.reduce((t, r) => t + r.dpsNow, 0))], ["Subclassed", rows.filter(r => r.subclass).length],
    ["Crowd control", secs(sum("controlGivenMs"))], ["Deaths", sum("deaths")],
  ];
  $("tiles").innerHTML = tiles.map(([label, value]) => `<div class="tile"><b>${value}</b><span>${label}</span></div>`).join("");
}

const iconOf = s => s.id === 0 ? "wow/texture?path=" + encodeURIComponent("Interface\\Icons\\INV_Sword_04") :
  s.icon ? "wow/spellicon?id=" + s.icon : "";
function renderBars(target, list, kind, title) {
  if (!list || !list.length) { target.innerHTML = ""; return; }
  const top = list[0].amount || 1;
  target.innerHTML = `<p>${title}</p>` + list.map(s => {
    const icon = iconOf(s);
    if (kind === "dps") return `<div><em title="${esc(s.name)}">${esc(s.name)}</em><s class="dps" style="width:${
      100 * s.amount / top}%"></s><b>${fmt(s.amount)}</b></div>`;
    return `<div>${icon ? `<img src="${icon}" alt="" onerror="this.outerHTML='<span class=noicon></span>'">` :
      '<span class="noicon"></span>'}<em title="${esc(s.name)} (${s.id})">${esc(s.name)}</em><s class="${kind || ""}"
      style="width:${100 * s.amount / top}%"></s><b>${fmt(s.amount)}</b></div>`;
  }).join("");
}

function renderSpark() {
  const canvas = $("spark"), ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const data = state.samples[state.selected] || [];
  if (data.length < 2) return;
  const top = Math.max(1, ...data);
  ctx.strokeStyle = "#5a4520";
  ctx.beginPath(); ctx.moveTo(0, canvas.height - 1); ctx.lineTo(canvas.width, canvas.height - 1); ctx.stroke();
  ctx.strokeStyle = "#ffd100"; ctx.lineWidth = 3; ctx.beginPath();
  data.forEach((v, i) => {
    const x = canvas.width * i / 119, y = canvas.height - 6 - (canvas.height - 16) * v / top;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = "#ffd100"; ctx.font = "22px Friz, Georgia, serif";
  ctx.fillText(fmt(top) + " peak", canvas.width - ctx.measureText(fmt(top) + " peak").width - 8, 26);
}

function renderDetail() {
  const c = state.live && state.live.characters.find(x => String(x.guid) === state.selected);
  if (!c) { $("detailTitle").textContent = "Pick a character"; return; }
  $("detailTitle").innerHTML = esc(c.name) + " · " + classCell(c.class, c.classId, c.subclass);
  renderSpark();
  renderBars($("spells"), c.spells, "", "Damage by ability (before armor and resistances)");
  renderBars($("heals"), c.heals, "heal", "Healing by ability");
}

const groupKeys = {
  combo: r => `${r.race} · ${specOf(r.classId, r.tree)} ${r.class}${r.subclass ? " + " + r.subclass : ""}`,
  pair: r => `${r.class}${r.subclass ? " + " + r.subclass : ""}`,
  class: r => r.class,
  race: r => r.race,
};

function comboRows() {
  if (!state.history || !state.history.combos) return [];
  const groups = {}, classDps = {};
  for (const r of state.history.combos) {
    const key = groupKeys[$("group").value](r);
    const g = groups[key] ||= { id: key, name: key, class: r.class, subclass: $("group").value === "race" ? "" : r.subclass,
      characters: 0, damage: 0, healing: 0, damageTaken: 0, controlGivenMs: 0, controlTakenMs: 0, deaths: 0, kills: 0,
      combatMs: 0, movedYards: 0, levelSum: 0 };
    for (const k of ["characters", "damage", "healing", "damageTaken", "controlGivenMs", "controlTakenMs", "deaths",
      "kills", "combatMs", "movedYards"]) g[k] += Number(r[k]) || 0;
    g.levelSum += (Number(r.level) || 0) * (Number(r.characters) || 0);
    if (!r.subclass) {
      const base = classDps[r.class] ||= { damage: 0, combatMs: 0 };
      base.damage += Number(r.damage) || 0; base.combatMs += Number(r.combatMs) || 0;
    }
  }
  const rows = Object.values(groups);
  const total = rows.reduce((t, g) => t + g.characters, 0) || 1;
  for (const g of rows) {
    g.share = 100 * g.characters / total;
    g.dps = perSec(g.damage, g.combatMs); g.hps = perSec(g.healing, g.combatMs); g.dtps = perSec(g.damageTaken, g.combatMs);
    g.ccPerMin = g.combatMs ? g.controlGivenMs / 1000 / (g.combatMs / 60000) : 0;
    g.deathsPerHour = g.combatMs ? g.deaths / (g.combatMs / 3600000) : 0;
    g.yardsPerMin = g.combatMs ? g.movedYards / (g.combatMs / 60000) : 0;
    g.level = g.characters ? g.levelSum / g.characters : 0;
    const base = classDps[g.class], baseDps = base ? perSec(base.damage, base.combatMs) : 0;
    g.vsClass = $("group").value !== "race" && g.subclass && baseDps ? 100 * (g.dps / baseDps - 1) : null;
  }
  return rows;
}

const comboColumns = [
  { key: "name", label: "Combo", left: true },
  { key: "characters", label: "Characters" },
  { key: "share", label: "Popularity", show: r => r.share.toFixed(1) + "%" },
  { key: "level", label: "Avg lvl", show: r => r.level.toFixed(0) },
  { key: "dps", label: "DPS", show: r => fmt(r.dps) },
  { key: "vsClass", label: "vs main class", show: r => r.vsClass === null ? '<span class="muted">–</span>' :
    `<span class="${r.vsClass >= 0 ? "up" : "down"}">${r.vsClass >= 0 ? "+" : ""}${r.vsClass.toFixed(1)}%</span>` },
  { key: "hps", label: "HPS", show: r => fmt(r.hps) },
  { key: "dtps", label: "Taken/s", show: r => fmt(r.dtps) },
  { key: "ccPerMin", label: "CC s/min", show: r => r.ccPerMin.toFixed(1) },
  { key: "deathsPerHour", label: "Deaths/h", show: r => r.deathsPerHour.toFixed(1) },
  { key: "kills", label: "Kills" },
  { key: "yardsPerMin", label: "Yards/min", show: r => fmt(r.yardsPerMin) },
  { key: "combatMs", label: "Combat time", show: r => secs(r.combatMs) },
];

function render() {
  const rows = sortRows(liveRows(), state.liveSort);
  renderTiles(rows);
  renderTable($("live"), liveColumns, rows, state.liveSort, id => { state.selected = id; render(); },
    r => (r.online ? "" : "offline ") + (r.id === state.selected ? "selected" : ""));
  renderDetail();
  const combos = sortRows(comboRows(), state.comboSort);
  renderTable($("combos"), comboColumns, combos, state.comboSort);
  const byDps = [...combos].sort((a, b) => b.dps - a.dps).slice(0, 25).map(g => ({ id: g.id, name: g.name, amount: g.dps }));
  renderBars($("comboBars"), byDps, "dps", "Top 25, total damage divided by time in combat");
}

async function pollLive() {
  try {
    const live = await (await fetch("feed/live", { cache: "no-store" })).json();
    if (live.offline) throw new Error("offline");
    const now = live.serverTimeMs;
    for (const c of live.characters) {
      const before = state.previous[c.guid];
      if (before && now > before.at) {
        const rate = Math.max(0, (c.session.damage - before.damage) / ((now - before.at) / 1000));
        state.rates[c.guid] = (state.rates[c.guid] || 0) * 0.5 + rate * 0.5;
      }
      state.previous[c.guid] = { at: now, damage: c.session.damage };
      const list = state.samples[c.guid] ||= [];
      list.push(state.rates[c.guid] || 0);
      if (list.length > 120) list.shift();
    }
    state.live = live;
    if (!state.selected && live.characters.length) state.selected = String(live.characters[0].guid);
    const up = live.uptimeSeconds;
    $("hpBar").style.width = "100%";
    $("status").textContent = "Live";
    $("manaBar").style.width = Math.min(100, 100 * up / 86400) + "%";
    $("uptime").textContent = `Up ${Math.floor(up / 3600)}h ${Math.floor(up % 3600 / 60)}m`;
    $("online").textContent = live.characters.filter(c => c.online).length;
  } catch (e) {
    $("hpBar").style.width = "0%";
    $("status").textContent = "Worldserver offline";
    $("manaBar").style.width = "0%";
    $("uptime").textContent = "Is mod-livemon enabled?";
  }
  render();
}

async function pollHistory() {
  try {
    const minutes = $("window").value;
    const history = await (await fetch("feed/history?minutes=" + minutes, { cache: "no-store" })).json();
    if (!history.offline) state.history = history;
    $("historyNote").textContent = "from the livemon_minute table, " + $("window").selectedOptions[0].text.toLowerCase();
  } catch (e) { }
  render();
}

$("window").onchange = pollHistory;
$("group").onchange = render;
pollLive(); pollHistory();
setInterval(pollLive, 1000);
setInterval(pollHistory, 15000);
</script>
</body>
